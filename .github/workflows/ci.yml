name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test and build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # The core tests make commits, which need a name and email.
      - name: Set a Git identity for the tests
        run: |
          git config --global user.name "GitKraked CI"
          git config --global user.email "ci@gitkraked.invalid"

      - run: npm ci

      - name: Lint TypeScript
        run: npx tsc --noEmit

      # Builds the UI into dist/, which the Tauri crate embeds at compile time.
      - name: Build UI
        run: npm run build

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test UI
        run: npm test

      - name: Test Rust
        run: cargo test --workspace --locked

      - name: Build app
        run: cargo build --workspace --locked
