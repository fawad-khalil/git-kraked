name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Check version and test
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # A tag must match the version in tauri.conf.json. A manual run from a branch
      # releases that version as v<version>.
      - name: Check the version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in src-tauri/tauri.conf.json (expected $tag)."
            exit 1
          fi
          echo "Releasing $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Set a Git identity for the tests
        run: |
          git config --global user.name "GitKraked CI"
          git config --global user.email "ci@gitkraked.invalid"

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test --workspace --locked

  draft:
    name: Create draft release
    needs: test
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.draft.outputs.result }}
    steps:
      - id: draft
        uses: actions/github-script@v7
        env:
          TAG: ${{ needs.test.outputs.tag }}
        with:
          script: |
            const tag = process.env.TAG;
            const releases = await github.paginate(github.rest.repos.listReleases, context.repo);
            const existing = releases.find((r) => r.tag_name === tag);
            if (existing && !existing.draft) {
              core.setFailed(`${tag} is already published. Bump the version in tauri.conf.json.`);
              return;
            }
            if (existing) {
              // Rerun: empty the draft so no files from a failed run are left on it.
              for (const asset of existing.assets) {
                await github.rest.repos.deleteReleaseAsset({ ...context.repo, asset_id: asset.id });
              }
              return existing.id;
            }
            const { data } = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `GitKraked ${tag}`,
              body: 'Download the installer for your system from the assets below.',
              draft: true,
            });
            return data.id;

  build:
    name: Build (${{ matrix.name }})
    needs: [test, draft]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --bundles msi,nsis
            files: |
              target/release/bundle/msi/*.msi
              target/release/bundle/nsis/*-setup.exe
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            files: |
              target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Linux
            os: ubuntu-22.04
            args: --bundles deb,rpm,appimage
            files: |
              target/release/bundle/deb/*.deb
              target/release/bundle/rpm/*.rpm
              target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.draft.outputs.release_id }}
          args: ${{ matrix.args }}

      # Also keep the installers on the workflow run, so they can be downloaded from
      # the Actions tab even if the release isn't published.
      - uses: actions/upload-artifact@v4
        with:
          name: GitKraked-${{ needs.test.outputs.tag }}-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [draft, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
        with:
          script: |
            const release_id = Number(process.env.RELEASE_ID);
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...context.repo,
              release_id,
            });
            const names = assets.map((a) => a.name);
            core.info(`Release assets:\n${names.join('\n')}`);
            const expected = {
              'Windows .msi': /\.msi$/,
              'Windows NSIS installer': /-setup\.exe$/,
              'macOS .dmg': /\.dmg$/,
              'Linux .deb': /\.deb$/,
              'Linux .rpm': /\.rpm$/,
              'Linux .AppImage': /\.AppImage$/,
            };
            const missing = Object.keys(expected).filter((k) => !names.some((n) => expected[k].test(n)));
            if (missing.length > 0) {
              core.setFailed(`Not publishing: the draft has no ${missing.join(', ')}.`);
              return;
            }
            await github.rest.repos.updateRelease({
              ...context.repo,
              release_id,
              draft: false,
            });
